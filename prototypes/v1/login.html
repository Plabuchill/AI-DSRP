<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ — AI-DSRP</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <div class="login-brand">
      <span class="login-brand-mark">ai-dsrp</span>
    </div>
    <h1 class="login-title">เข้าสู่ระบบ</h1>
    <p class="body-secondary login-subtitle">AI Disease Surveillance &amp; Response Platform — ลงชื่อเข้าใช้ด้วยบัญชีที่ได้รับจากผู้ดูแลระบบ</p>

    <form id="login-form" class="login-form" novalidate>
      <div class="form-field">
        <label for="login-email">อีเมล</label>
        <input type="email" id="login-email" name="email" autocomplete="username" placeholder="เช่น srrt1@ai-dsrp.local" required>
      </div>

      <div class="form-field">
        <label for="login-password">รหัสผ่าน</label>
        <input type="password" id="login-password" name="password" autocomplete="current-password" placeholder="รหัสผ่าน" required>
      </div>

      <p id="login-error" class="login-error" role="alert" style="display:none;"></p>
      <p id="login-info" class="login-error" role="status" style="display:none;"></p>

      <button type="submit" class="btn btn-primary login-submit" id="btn-login">เข้าสู่ระบบ</button>
      <button type="button" class="btn btn-outline login-submit" id="btn-forgot-password">ลืมรหัสผ่าน?</button>
      <a class="btn btn-outline login-submit" href="signup.html">สมัครสมาชิกใหม่</a>
    </form>
  </div>

  <footer class="footer login-footer">
    AI Disease Surveillance &amp; Response Platform — Prototype v1 · ข้อมูลทั้งหมดเป็นข้อมูลจำลองเพื่อการสาธิตเท่านั้น
  </footer>
</div>
<script type="module" src="login.js"></script>
</body>
</html>
